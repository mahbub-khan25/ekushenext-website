[package]
name = "ekushe-web"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Ekushe Next engine compiled to WebAssembly for the website's live typing demo"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "trim-dict"
path = "src/bin/trim_dict.rs"

[dependencies]
ekushe-core = { path = "../../ekushenext/crates/ekushe-core" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
